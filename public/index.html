<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>From the Sources</title>
  <meta name="description" content="Upload pages about one person, ask 20 questions, and get a life story woven only from the retrieved snippets, every sentence cited." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="app.css?v=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='4' width='22' height='24' rx='3' fill='%2323395b'/%3E%3Cpath d='M10 11h12M10 16h12M10 21h7' stroke='%23f4efe6' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="top">
    <a class="brand" href="#/"><span class="mark" aria-hidden="true"></span>From the Sources</a>
    <span class="tag">every sentence traced to a chunk</span>
  </header>
  <main id="view" tabindex="-1"><p class="muted">Loading…</p></main>

  <dialog id="codeDialog">
    <form method="dialog" id="codeForm">
      <h2>Access code</h2>
      <p>Adding pages and running questions uses the AI service, so it needs the access code.</p>
      <input id="codeInput" type="password" autocomplete="current-password" required aria-label="Access code" />
      <p class="error" id="codeError"></p>
      <div class="row end">
        <button type="button" class="ghost" id="codeCancel">Cancel</button>
        <button class="primary">Continue</button>
      </div>
    </form>
  </dialog>

  <aside id="chunkPanel" class="panel" hidden aria-live="polite">
    <button class="close" id="chunkClose" aria-label="Close">×</button>
    <div id="chunkBody"></div>
  </aside>

  <footer class="foot">Retrieval-augmented story · MCON 368 · <a href="https://github.com/mjackier/biography-rag">source on GitHub</a></footer>
  <script src="app.js?v=1" type="module"></script>
</body>
</html>
